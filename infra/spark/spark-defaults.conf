###############################################################################
# spark-defaults.conf — Iceberg + Nessie + MinIO
#
# Design decision: Use Nessie native API (not Iceberg REST) because:
#   1. Branch/tag operations (WAP) need native Nessie SQL extensions
#   2. Battle-tested integration path for Spark
#   3. REST catalog (/iceberg) is newer, used by Trino side
#
# Jar downloads happen on first spark-submit. Subsequent runs use cache.
###############################################################################

# ── Iceberg + Nessie runtime jars ──────────────────────────────────────────
spark.jars.packages                 org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.7.1,org.projectnessie.nessie-integrations:nessie-spark-extensions-3.5_2.12:0.99.0,software.amazon.awssdk:bundle:2.29.38,software.amazon.awssdk:url-connection-client:2.29.38

# ── Iceberg SQL extensions ─────────────────────────────────────────────────
spark.sql.extensions                org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.projectnessie.spark.extensions.NessieSparkSessionExtensions

# ── Nessie catalog ─────────────────────────────────────────────────────────
spark.sql.catalog.nessie                            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.nessie.catalog-impl               org.apache.iceberg.nessie.NessieCatalog
spark.sql.catalog.nessie.uri                         http://nessie:19120/api/v2
spark.sql.catalog.nessie.ref                         main
spark.sql.catalog.nessie.warehouse                   s3://lake/warehouse
spark.sql.catalog.nessie.cache-enabled               true

# ── S3 / MinIO configuration ──────────────────────────────────────────────
spark.sql.catalog.nessie.io-impl                     org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.nessie.s3.endpoint                 http://minio:9000
spark.sql.catalog.nessie.s3.path-style-access        true
spark.sql.catalog.nessie.s3.access-key-id            minioadmin
spark.sql.catalog.nessie.s3.secret-access-key         minioadmin123
spark.sql.catalog.nessie.s3.region                   us-east-1

# ── Hadoop S3A for reading landing zone (non-Iceberg paths) ───────────────
spark.hadoop.fs.s3a.endpoint                         http://minio:9000
spark.hadoop.fs.s3a.access.key                       minioadmin
spark.hadoop.fs.s3a.secret.key                       minioadmin123
spark.hadoop.fs.s3a.path.style.access                true
spark.hadoop.fs.s3a.impl                             org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled           false

# ── Default catalog ───────────────────────────────────────────────────────
spark.sql.defaultCatalog                             nessie

# ── Timezone ──────────────────────────────────────────────────────────────
spark.sql.session.timeZone                           Asia/Bangkok

# ── Performance tuning (laptop) ───────────────────────────────────────────
spark.driver.memory                                  1g
spark.executor.memory                                1g
spark.sql.adaptive.enabled                           true
spark.sql.adaptive.coalescePartitions.enabled        true
