###############################################################################
# iceberg.properties — Trino Iceberg connector with Nessie catalog
#
# Catalog name in Trino = filename = "iceberg"
# Usage: SELECT * FROM iceberg.bronze.weather_raw
#
# Design decision: Use iceberg.catalog.type=nessie (not REST) because:
#   - Direct Nessie API integration is more mature in Trino
#   - Allows branch/tag awareness in SQL: USE nessie.ref.branch_name
###############################################################################

connector.name=iceberg

# ── Nessie catalog ─────────────────────────────────────────────────────────
iceberg.catalog.type=nessie
iceberg.nessie-catalog.uri=http://nessie:19120/api/v1
iceberg.nessie-catalog.ref=main
iceberg.nessie-catalog.default-warehouse-dir=s3://lake/warehouse

# ── S3 / MinIO filesystem ─────────────────────────────────────────────────
# Use Trino native S3 filesystem (not legacy Hive)
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin123
s3.region=us-east-1
s3.path-style-access=true
