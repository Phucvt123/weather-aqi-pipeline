###############################################################################
# docker-compose.lakehouse.yml — Weather AQI Lakehouse Stack
#
# Services: MinIO, Nessie, Spark (master+worker), Trino, Airflow, Postgres, Streamlit
# Target RAM: ~8GB (set WSL2 to 10GB)
#
# Usage:
#   docker compose -f docker-compose.lakehouse.yml up -d
#   docker compose -f docker-compose.lakehouse.yml down
###############################################################################

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__WORKERS: '2'
    # MinIO credentials (for ingestion landing writer)
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin123
    # AWS credentials & region for Spark driver / Iceberg S3FileIO
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin123
    AWS_REGION: us-east-1
    AWS_DEFAULT_REGION: us-east-1
    PYTHONPATH: /opt/airflow:/opt/spark-apps
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./ingestion:/opt/airflow/ingestion
    - ./spark:/opt/spark-apps/spark:ro
    - ./infra/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
  depends_on:
    postgres:
      condition: service_healthy
  deploy:
    resources:
      limits:
        memory: 512M

services:
  # ──────────────────────────── Storage Layer ────────────────────────────

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: lakehouse-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # Create the 'lake' bucket on first boot
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set lakeminio http://minio:9000 minioadmin minioadmin123 &&
        mc mb lakeminio/lake --ignore-existing &&
        mc mb lakeminio/lake/warehouse --ignore-existing &&
        echo 'Bucket lake created successfully'
      "
    restart: "no"

  # ──────────────────────────── Catalog Layer ────────────────────────────

  nessie:
    image: ghcr.io/projectnessie/nessie:0.99.0
    container_name: lakehouse-nessie
    environment:
      # Persist catalog state in Postgres (not IN_MEMORY)
      NESSIE_VERSION_STORE_TYPE: JDBC
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/nessie
      QUARKUS_DATASOURCE_USERNAME: airflow
      QUARKUS_DATASOURCE_PASSWORD: airflow
      # Default warehouse location in MinIO
      NESSIE_CATALOG_DEFAULT_WAREHOUSE: s3://lake/warehouse
      # S3/MinIO config for Nessie catalog
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ENDPOINT: http://minio:9000
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_PATH_STYLE_ACCESS: "true"
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_REGION: us-east-1
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ACCESS_KEY_ID: minioadmin
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_SECRET_ACCESS_KEY: minioadmin123
    ports:
      - "19120:19120"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v2/config"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ──────────────────────────── Compute: Spark ────────────────────────────

  spark-master:
    image: bitnamilegacy/spark:3.5.3
    container_name: lakehouse-spark-master
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8082"
      PYTHONPATH: /opt/spark-apps
      # Pass MinIO creds to Spark
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_REGION: us-east-1
    ports:
      - "7077:7077"   # Spark master
      - "8082:8082"   # Spark master UI
    volumes:
      - ./infra/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
      - ./spark:/opt/spark-apps/spark:ro
      - ./ingestion:/opt/spark-apps/ingestion:ro
      - ./scripts:/opt/spark-apps/scripts:ro
    deploy:
      resources:
        limits:
          memory: 512M

  spark-worker:
    image: bitnamilegacy/spark:3.5.3
    container_name: lakehouse-spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: "2"
      PYTHONPATH: /opt/spark-apps
      # Pass MinIO creds to Spark
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_REGION: us-east-1
    volumes:
      - ./infra/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
      - ./spark:/opt/spark-apps/spark:ro
      - ./ingestion:/opt/spark-apps/ingestion:ro
      - ./scripts:/opt/spark-apps/scripts:ro
    depends_on:
      - spark-master
    deploy:
      resources:
        limits:
          memory: 2G

  # ──────────────────────────── Compute: Trino ────────────────────────────

  trino:
    image: trinodb/trino:462
    container_name: lakehouse-trino
    ports:
      - "8083:8080"   # Trino UI (shifted to avoid Airflow conflict)
    volumes:
      - ./infra/trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_REGION: us-east-1
    depends_on:
      nessie:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 15s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

  # ──────────────────────────── Orchestration ────────────────────────────

  postgres:
    image: postgres:15
    container_name: lakehouse-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    ports:
      - "5435:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    deploy:
      resources:
        limits:
          memory: 256M

  airflow-init:
    <<: *airflow-common
    container_name: lakehouse-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
        # Create Spark connection for SparkSubmitOperator
        airflow connections add spark_default \
          --conn-type spark \
          --conn-host 'spark://spark-master:7077' \
          2>/dev/null || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: lakehouse-airflow-web
    command: bash -c "rm -f /opt/airflow/airflow-webserver.pid && exec airflow webserver"
    ports:
      - "8080:8080"
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: lakehouse-airflow-scheduler
    command: airflow scheduler
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # ──────────────────────────── Presentation ────────────────────────────

  streamlit:
    build: ./dashboard
    container_name: lakehouse-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app
    environment:
      # Phase 4: switch from Postgres to Trino
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_CATALOG: iceberg
      # Keep old Postgres config for backward compat during migration
      DATA_DB_HOST: postgres
      DATA_DB_PORT: "5432"
      DATA_DB_NAME: airflow
      DATA_DB_USER: airflow
      DATA_DB_PASSWORD: airflow
    depends_on:
      - trino
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  minio_data:
  pg_data:
